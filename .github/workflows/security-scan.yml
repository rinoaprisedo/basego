name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any push — new CVEs get published against
    # already-committed dependency versions all the time.
    - cron: "0 3 * * 1"

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # docs/ is gitignored (main.go imports it) — generate it first or the
      # build fails with "could not import baseadmin/backend/docs" before
      # govulncheck even gets to scan anything.
      - run: go install github.com/swaggo/swag/cmd/swag@latest
      - run: swag init -g main.go -o docs
        working-directory: backend
      - run: govulncheck ./...
        working-directory: backend

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # --audit-level=high: dependency trees always carry some open low/moderate
      # advisories with no fix available; failing on those makes the gate noisy
      # enough that people stop reading it. High/critical is the actionable bar.
      - run: npm audit --audit-level=high
        working-directory: frontend
